<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wien · 12. bis 14. November</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#141414;--ink2:#3d3a36;--soft:#8a857e;--rule:#dcd8d1;--y:#ecd35a;--fd:"Bodoni Moda",serif;--fb:Newsreader,Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font:17px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .sc{font-variant:all-small-caps;letter-spacing:.14em}
  .wrap{max-width:660px;margin:0 auto;padding:0 22px 80px}
  header{text-align:center;padding:40px 0 10px}
  .chandelier{width:210px;height:auto;display:block;margin:0 auto 4px}
  h1{font:italic 400 clamp(64px,15vw,104px)/.9 var(--fd);margin:8px 0 10px;letter-spacing:-.01em}
  .sub{font-size:15px;color:var(--ink2)}
  .orn{display:flex;align-items:center;gap:14px;justify-content:center;margin:22px 0;color:var(--soft)}
  .orn:before,.orn:after{content:"";height:1px;width:70px;background:var(--rule)}
  nav.days{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);display:flex;justify-content:center;gap:34px;padding:14px 0 12px;border-bottom:1px solid var(--rule)}
  nav.days button{all:unset;cursor:pointer;font:italic 400 24px/1 var(--fd);color:var(--soft);padding-bottom:6px;border-bottom:1px solid transparent}
  nav.days button small{display:block;font:400 12px/1 var(--fb);font-style:normal;font-variant:all-small-caps;letter-spacing:.14em;text-align:center;margin-top:5px}
  nav.days button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .dayintro{text-align:center;margin:38px 0 6px}
  .dayintro h2{font:italic 400 46px/1 var(--fd);margin:4px 0 12px}
  .dayintro p{color:var(--ink2);margin:0 auto;max-width:520px;font-size:16.5px}
  .box{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin:30px 0}
  .box>div{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:16px 4px 12px}
  .box h3{margin:0 0 8px;text-align:center;font-size:15px;font-weight:500}
  .box dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15.5px}
  .box dt{font-style:italic;color:var(--ink)} .box dd{margin:0;color:var(--ink2)}
  .map{margin:30px 0 6px}
  .map svg{width:100%;height:auto;display:block}
  .legend{font-size:13px;color:var(--soft);text-align:center;margin-top:6px;line-height:1.5}
  h3.period{display:flex;align-items:center;gap:16px;margin:46px 0 8px;font-weight:500;font-size:15px;color:var(--ink)}
  h3.period:before,h3.period:after{content:"";flex:1;height:1px;background:var(--rule)}
  .stop{display:grid;grid-template-columns:78px 1fr;gap:4px 18px;padding:22px 0 20px;border-bottom:1px solid var(--rule)}
  .stop:last-child{border-bottom:0}
  .tcol{text-align:right}
  .time{font:400 24px/1 var(--fd);font-variant-numeric:lining-nums}
  .tick{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--ink);border-radius:50%;font:500 12px/1 var(--fb);margin-top:10px}
  .stop.done .tick{background:var(--ink);color:#fff}
  .stop.done .body{opacity:.45}
  .stop.hotel .tick{border-style:dotted}
  .stop.walk .tick{border-style:dashed}
  .stop.walk .name{font-style:italic;font-weight:400}
  .alt{margin:14px 0 0;padding:10px 14px;border:1px dashed var(--rule);font-size:15px;color:var(--ink2)}
  .alt .sc{color:var(--soft);font-size:13px;margin-right:4px}
  .planb .sc{display:block;margin-bottom:6px;color:var(--ink)}
  .planb .pts{margin:0 0 10px}
  .alt b{font-weight:500;color:var(--ink);font-style:italic}
  .alt a.addr{font-size:14px;margin-left:4px}
  .map svg{border-radius:4px}
  .stop.opt .tick{background:var(--y);border-color:var(--y)}
  .what{font-size:13px;color:var(--soft)}
  .name{font:500 27px/1.12 var(--fd);margin:2px 0 6px}
  .stop.opt .name{font-style:italic}
  .stop.opt .what:after{content:" · optional"}
  .stop.hotel .name{font-size:22px}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .icon{width:56px;height:56px;flex:0 0 56px;color:var(--ink);margin-top:-6px}
  .icon .y{fill:var(--y);stroke:none} .icon .k{fill:currentColor;stroke:none} .icon .h{stroke-width:.6;opacity:.85}
  .pts{margin:4px 0 12px;padding:0;list-style:none;color:var(--ink2)}
  .pts li{position:relative;padding:2px 0 2px 16px}
  .pts li:before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--ink)}
  .stop.walk .pts li:before{background:none;border:1px solid var(--ink);width:4px;height:4px}
  a.addr{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:1px}
  a.addr:hover{border-bottom-color:var(--ink)}
  .pin{width:11px;height:13px;flex:0 0 auto}
  .x{margin:14px 0 0;padding:0;list-style:none;font-size:15px}
  .x li{padding:6px 0 6px 18px;position:relative;color:var(--ink2)}
  .x li:before{content:"–";position:absolute;left:0;color:var(--soft)}
  .x b{font-weight:500;color:var(--ink);font-style:italic}
  .x a.addr{font-size:14px;margin-left:4px}
  .go{grid-column:2;font-size:14.5px;font-style:italic;color:var(--soft);margin-top:12px}
  .go:before{content:"→ ";font-style:normal}
  details{margin-top:50px;border-top:1px solid var(--ink)}
  summary{cursor:pointer;list-style:none;text-align:center;padding:18px 0;font:italic 400 26px/1 var(--fd)}
  summary::-webkit-details-marker{display:none}
  details h4{text-align:center;font-weight:500;font-size:14px;margin:22px 0 6px}
  .rest li{padding:7px 0;border-bottom:1px solid var(--rule);list-style:none;font-size:15.5px;color:var(--ink2)}
  .rest ul{padding:0;margin:0}
  .rest b{font-weight:500;color:var(--ink)}
  .rest a.addr{font-size:14px;margin-left:6px}
  footer{text-align:center;color:var(--soft);font-size:14px;margin-top:40px}
  footer button{all:unset;cursor:pointer;border-bottom:1px solid var(--rule);margin-top:10px;display:inline-block}
  @media(max-width:520px){.stop{grid-template-columns:58px 1fr;gap:4px 14px}.time{font-size:20px}.name{font-size:23px}nav.days{gap:14px} nav.days button{font-size:20px}.icon{width:46px;height:46px;flex-basis:46px}}
</style>
</head>

function mapSVG(stops,opt={}){
  const ink=opt.ink||"#141414", fill=opt.fill||"#fff";
  const {a,b,c,d}=opt.bounds||BOUNDS, W=opt.w||700, k=Math.cos(48.2*Math.PI/180);
  const sx=W/(d-c), H=Math.round((b-a)*sx/k), sy=H/(b-a);
  const X=v=>(v-c)*sx, Y=v=>H-(v-a)*sy;
  const pt=q=>`${X(q[1]).toFixed(1)} ${Y(q[0]).toFixed(1)}`;
  const line=arr=>"M"+arr.map(pt).join(" L");
  const smooth=arr=>{let p="M"+pt(arr[0]);for(let i=1;i<arr.length;i++){const m=[(arr[i-1][0]+arr[i][0])/2,(arr[i-1][1]+arr[i][1])/2];p+=` Q${pt(arr[i-1])} ${pt(m)}`;}return p+" L"+pt(arr[arr.length-1]);};
  const poly=arr=>line(arr)+" Z";
  const base=`<defs>
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation=".7"/></filter>
    <filter id="wc2"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .10 0"/></filter>
    <clipPath id="mclip"><rect width="${W}" height="${H}" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#mclip)">
    <rect width="${W}" height="${H}" fill="#fbf8f1"/>
    <g filter="url(#wc)">
      <path d="${poly(GEO.ring)}" fill="#efe2c6" opacity=".85"/>
      <path d="${poly(GEO.prater)}" fill="#cdd6b4" opacity=".8"/>
      ${GEO.parks.map(p=>`<path d="${poly(p)}" fill="#c3cfa6" opacity=".85"/>`).join("")}
      <path d="${smooth(GEO.canal)}" fill="none" stroke="#a7bfc6" stroke-width="15" stroke-linecap="round" opacity=".75"/>
      <path d="${smooth(GEO.wien)}" fill="none" stroke="#b5c8cc" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    </g>
    <g filter="url(#wc2)" fill="none" stroke="#5e5850" stroke-linecap="round">
      <path d="${poly(GEO.ring)}" stroke-width="1.1" opacity=".55"/>
      <path d="${smooth(GEO.canal)}" stroke-width=".6" opacity=".35" transform="translate(0,-7)"/>
      ${GEO.roads.map(r=>`<path d="${smooth(r)}" stroke-width=".7" opacity=".3"/>`).join("")}
    </g>
    ${GEO.labels.map(l=>`<text x="${X(l[2])}" y="${Y(l[1])}" transform="rotate(${l[4]} ${X(l[2])} ${Y(l[1])})" text-anchor="middle" font-size="${l[3]}" fill="#7a7268" style="font-family:var(--fd);font-style:italic;letter-spacing:.02em">${l[0]}</text>`).join("")}
    <rect width="${W}" height="${H}" filter="url(#paper)"/>
  </g>
  <rect x=".5" y=".5" width="${W-1}" height="${H-1}" rx="4" fill="none" stroke="#141414" stroke-width=".8"/>
  <g transform="translate(${W-34},30)" fill="none" stroke="#141414" stroke-width=".9" stroke-linecap="round"><path d="M0 -14 L4 4 L0 1 L-4 4 Z" fill="#141414"/><text y="18" text-anchor="middle" font-size="11" fill="#141414" stroke="none" style="font-family:var(--fd)">N</text></g>`;
  let p="",dots="",prev=null;
  stops.forEach((s,i)=>{if(s.nomap)return;const x=X(s.lng),y=Y(s.lat);
    if(!prev)p+=`M${x.toFixed(1)} ${y.toFixed(1)} `;else{const mx=(prev[0]+x)/2+(i%2?10:-10),my=(prev[1]+y)/2+(i%2?-8:8);p+=`Q${mx.toFixed(1)} ${my.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)} `;}
    prev=[x,y];const lab=label(stops,i);
    const f=s.k==="hotel"||s.k==="walk"?fill:s.k==="opt"?"#ecd35a":ink, tc=s.k==="fix"?fill:ink;

const mapLegend=stops=>stops.map((s,i)=>`${label(stops,i)} ${esc(s.n)}`).join(" · ");

function bindTicks(rerender){
  document.querySelectorAll("[data-tick]").forEach(el=>el.onclick=e=>{e.preventDefault();const id=el.dataset.tick;
    if(done[id])delete done[id];else done[id]=1;saveDone();const y=window.scrollY;rerender();window.scrollTo(0,y);});
}
function startApp(render){
  const keys=Object.keys(DAYS);
  const go=()=>{const k=location.hash.slice(1);const key=DAYS[k]?k:keys[0];render(key);
    document.querySelectorAll("[data-day]").forEach(b=>b.classList.toggle("on",b.dataset.day===key));
    bindTicks(()=>go());};
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.day;});
  window.addEventListener("hashchange",go);go();
  const r=document.getElementById("reset");if(r)r.onclick=()=>{done={};saveDone();go();};
}

function render(key){
  const d=DAYS[key];let h=`<div class="dayintro"><div class="sc" style="font-size:14px;color:var(--soft)">${d.date}</div><h2>${d.title}</h2><p>${d.sub}</p></div>`;
  if(d.arrival) h+=`<div class="box"><div><h3 class="sc">Vom Flughafen zum Hotel</h3><dl>${ARRIVAL.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl></div></div>`;
  h+=`<div class="map">${mapSVG(d.stops,{bounds:d.bounds})}<div class="legend">${mapLegend(d.stops)}</div></div>`;
  groups(d.stops).forEach(g=>{
    h+=`<h3 class="period sc">${g.p}</h3>`;
    g.items.forEach(([s,i])=>{const id=key+i;
      h+=`<div class="stop ${s.k}${done[id]?" done":""}"><div class="tcol"><div class="time">${s.t}</div><button class="tick" data-tick="${id}" title="Abhaken">${done[id]?"✓":label(d.stops,i)}</button></div>
      <div class="body"><div class="what sc">${esc(s.w)}</div><div class="name">${esc(s.n)}</div>
      ${s.c.length?`<ul class="pts">${s.c.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}${addr(s.n,s.a)}
      ${s.planb?`<div class="alt planb"><div class="sc">${esc(s.planb.title)}</div><ul class="pts">${s.planb.pts.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>${addr(s.planb.place[0],s.planb.place[1])}</div>`:""}
      ${s.alt?`<div class="alt"><span class="sc">oder</span> <b>${esc(s.alt[0])}</b>. ${esc(s.alt[2])} ${addr(s.alt[0],s.alt[1])}</div>`:""}
      ${s.x?`<ul class="x">${s.x.map(e=>`<li><b>${esc(e[0])}</b>. ${esc(e[2])} ${addr(e[0],e[1])}</li>`).join("")}</ul>`:""}</div>
      ${s.go?`<div class="go">${esc(s.go)}</div>`:""}</div>`;});
  });
  document.getElementById("app").innerHTML=h;
}
startApp(render);
</script>
</body>
</html>
